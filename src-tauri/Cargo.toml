[package]
name = "prismbar"
version = "3.3.1"
description = "PrismBar — Custom Shell & Start Launcher"
authors = ["PrismBar"]
edition = "2021"

[lib]
name = "testbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
base64 = "0.22"
png = "0.17"
rfd = "0.15"
dirs = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.58"
webview2-com = "0.39"
windows-core-wv2 = { package = "windows-core", version = "0.62" }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
  "implement",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_TaskScheduler",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_SystemServices",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_Storage_Xps",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "Graphics_Effects",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Storage_Streams",
]

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
