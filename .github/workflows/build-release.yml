name: Build & Release PrismBar

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v3.3.0) to publish a GitHub Release'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-macos-arm64:
    name: Build macOS M1 (aarch64-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust toolchain (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate macOS app icon (icon.icns)
        run: |
          set -euo pipefail
          SRC_ICON="src-tauri/icons/128x128.png"
          test -f "$SRC_ICON"
          ICONSET="${RUNNER_TEMP:-/tmp}/icon.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"

          sips -s format png -z 16 16     "$SRC_ICON" --out "$ICONSET/icon_16x16.png"
          sips -s format png -z 32 32     "$SRC_ICON" --out "$ICONSET/icon_16x16@2x.png"
          sips -s format png -z 32 32     "$SRC_ICON" --out "$ICONSET/icon_32x32.png"
          sips -s format png -z 64 64     "$SRC_ICON" --out "$ICONSET/icon_32x32@2x.png"
          sips -s format png -z 128 128   "$SRC_ICON" --out "$ICONSET/icon_128x128.png"
          sips -s format png -z 256 256   "$SRC_ICON" --out "$ICONSET/icon_128x128@2x.png"
          sips -s format png -z 256 256   "$SRC_ICON" --out "$ICONSET/icon_256x256.png"
          sips -s format png -z 512 512   "$SRC_ICON" --out "$ICONSET/icon_256x256@2x.png"
          sips -s format png -z 512 512   "$SRC_ICON" --out "$ICONSET/icon_512x512.png"
          sips -s format png -z 1024 1024 "$SRC_ICON" --out "$ICONSET/icon_512x512@2x.png"

          iconutil -c icns "$ICONSET" -o "src-tauri/icons/icon.icns"
          rm -rf "$ICONSET"
          test -s "src-tauri/icons/icon.icns"
          ls -lh "src-tauri/icons/icon.icns"

      - name: Install JS dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile || {
            echo "::warning::pnpm-lock.yaml out of sync, falling back to pnpm install"
            pnpm install
          }

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend bundle
        run: pnpm build

      - name: Run macOS Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build macOS .app bundle (aarch64-apple-darwin)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          pnpm tauri build --target aarch64-apple-darwin --bundles app
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/PrismBar.app"
          test -d "$APP_PATH"
          ls -ld "$APP_PATH"

      - name: Ad-hoc codesign PrismBar.app
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/PrismBar.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package and sign macOS updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          rm -rf release
          mkdir -p release

          tar -czf "release/PrismBar-macOS-arm64.app.tar.gz" -C "$BUNDLE_DIR" "PrismBar.app"
          APP_VERSION="$(node -p "require('./package.json').version")"
          pnpm tauri signer sign --app-version "$APP_VERSION" "release/PrismBar-macOS-arm64.app.tar.gz"

          test -s "release/PrismBar-macOS-arm64.app.tar.gz"
          test -s "release/PrismBar-macOS-arm64.app.tar.gz.sig"
          ls -lh release/

      - name: Package .dmg installer
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/PrismBar.app"
          rm -rf release/stage
          mkdir -p release/stage

          ditto "$APP_PATH" "release/stage/PrismBar.app"
          ln -s /Applications "release/stage/Applications"

          printf '%s\n' \
            "1) Перетащи PrismBar в папку «Программы» (Applications)." \
            "2) Если macOS скажет, что разработчик не проверен: Системные настройки -> Конфиденциальность и безопасность -> «Открыть всё равно»." \
            "3) При первом запуске выдай доступ в «Универсальный доступ» (кнопка будет прямо в окне), чтобы меню открывалось по одиночному нажатию Command." \
            > "release/stage/Как запустить.txt"

          hdiutil create -volname "PrismBar" -srcfolder "release/stage" -ov -format UDZO "release/PrismBar-macOS-arm64.dmg"
          rm -rf release/stage
          test -s "release/PrismBar-macOS-arm64.dmg"
          ls -lh "release/PrismBar-macOS-arm64.dmg"

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prismbar-macos-arm64
          path: |
            release/PrismBar-macOS-arm64.dmg
            release/PrismBar-macOS-arm64.app.tar.gz
            release/PrismBar-macOS-arm64.app.tar.gz.sig
          retention-days: 30
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "pnpm-lock.yaml out of sync, falling back to pnpm install"
            pnpm install
          }

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend bundle
        run: pnpm build

      - name: Run Windows Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build signed Windows NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --bundles nsis

      - name: Stage Windows installer & updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'release') { Remove-Item -Recurse -Force 'release' }
          New-Item -ItemType Directory -Path 'release' | Out-Null

          $nsisDir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem -Path $nsisDir -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe) {
            throw "NSIS setup executable not found in $nsisDir"
          }

          $outExe = 'release/PrismBar-Windows-x64-setup.exe'
          $outSig = 'release/PrismBar-Windows-x64-setup.exe.sig'
          Copy-Item -Path $exe.FullName -Destination $outExe -Force

          $sig = Get-ChildItem -Path $nsisDir -Filter '*-setup.exe.sig' | Select-Object -First 1
          if ($sig) {
            Copy-Item -Path $sig.FullName -Destination $outSig -Force
          } else {
            $appVersion = (node -p "require('./package.json').version").Trim()
            pnpm tauri signer sign --app-version $appVersion $outExe
          }

          if (-not (Test-Path $outExe) -or (Get-Item $outExe).Length -le 0) {
            throw "Missing or empty $outExe"
          }
          if (-not (Test-Path $outSig) -or (Get-Item $outSig).Length -le 0) {
            throw "Missing or empty $outSig"
          }
          Get-ChildItem release/

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prismbar-windows-x64
          path: |
            release/PrismBar-Windows-x64-setup.exe
            release/PrismBar-Windows-x64-setup.exe.sig
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish Signed Multi-Platform Release
    runs-on: ubuntu-latest
    needs: [build-macos-arm64, build-windows-x64]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prismbar-*
          path: release
          merge-multiple: true

      - name: Generate and validate updater latest.json
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.RELEASE_TAG;
            if (!tag) throw new Error("Missing RELEASE_TAG");
            const macSig = fs.readFileSync("release/PrismBar-macOS-arm64.app.tar.gz.sig", "utf8").trim();
            const winSig = fs.readFileSync("release/PrismBar-Windows-x64-setup.exe.sig", "utf8").trim();
            if (!macSig || !winSig) throw new Error("Empty updater signature");
            const base = `https://github.com/Suther1and/prismbar/releases/download/${tag}`;
            const manifest = {
              version: pkg.version,
              notes: `PrismBar ${tag}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": {
                  signature: macSig,
                  url: `${base}/PrismBar-macOS-arm64.app.tar.gz`
                },
                "windows-x86_64": {
                  signature: winSig,
                  url: `${base}/PrismBar-Windows-x64-setup.exe`
                }
              }
            };
            fs.writeFileSync("release/latest.json", JSON.stringify(manifest, null, 2) + "\n");
            const parsed = JSON.parse(fs.readFileSync("release/latest.json", "utf8"));
            if (!parsed.platforms["darwin-aarch64"].signature || !parsed.platforms["windows-x86_64"].signature) {
              throw new Error("Invalid latest.json manifest");
            }
          '
          cat release/latest.json
          ls -lh release/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: PrismBar ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            release/latest.json
            release/PrismBar-macOS-arm64.dmg
            release/PrismBar-macOS-arm64.app.tar.gz
            release/PrismBar-macOS-arm64.app.tar.gz.sig
            release/PrismBar-Windows-x64-setup.exe
            release/PrismBar-Windows-x64-setup.exe.sig
          generate_release_notes: true
