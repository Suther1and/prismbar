[[entry]]
id = 5
type = "story"
title = "Standalone release .exe packaging & full UX/NFR compliance sign-off"
description = "Finalizes tauri.conf.json standalone local release packaging, runs automated UX compliance checks against DESIGN.md and EXPERIENCE.md Hard Exclusions (zero emoji, zero tutorial hints, prefers-reduced-motion, zero excluded widgets) plus idle resource sanity verification, and builds src-tauri/target/release/testbar.exe via pnpm tauri build."
verify = "pnpm build, pnpm test, cargo test --manifest-path src-tauri/Cargo.toml, and pnpm tauri build all succeed with zero errors and produce a verified standalone src-tauri/target/release/testbar.exe."
covers = ["R4"]
after = ["1.5", "2.5", "3.4", "4.4", 4]
hitl = false
risk = "medium"
