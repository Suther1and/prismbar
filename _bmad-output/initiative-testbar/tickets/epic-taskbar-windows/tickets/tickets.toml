# Stories for Epic 2: Bottom Taskbar, Real Window Tracking, UWP Icons, Previews & Context Menus
# Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Unified IconCache, TextScaleFactor/Win-mask fix & diff-only visible-window broadcasts"
description = "Implements src-tauri/src/icon_cache.rs (256-entry LRU, namespaced exe:/aumid:/hwnd:/file: keys, batch get_icons IPC) plus frontend Map cache in src/lib/ipc.ts, refactors the window tracker poller in lib.rs to emit windows-updated only on actual window/focus diffs targeting visible windows (taskbar + visible start/flyout), fixes effective_scale = dpi_scale * (TextScaleFactor / 100.0) across taskbar/start/flyout sizing with WebView2 bounds sync + unconstrained taskbar scrollWidth + 84px height (eliminating top/right clipping and black shadow rectangle), and fixes lone-Win KEYUP masking (SendInput [0xE8 down, 0xE8 up, Win up] + return LRESULT(1) + fast Shell_TrayWnd hide guard) so native Windows Start never pops over TestBar."
verify = "Cargo unit tests verify IconCache LRU eviction, namespaced key generation, TextScaleFactor effective_scale math, lone-Win LRESULT(1) swallow logic, and visible-window diff-only emission; Vitest verifies frontend icon batch fetch caching; pnpm build, pnpm test, and cargo test pass."
covers = ["R1"]
after = ["1.5"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "UWP & Win32 real icon extraction (RAII COM) and pinned/running deduplication"
description = "Adds Win32_Storage_Packaging_Appx support and an RAII COM guard in windows_tracker.rs (per AD-5) to resolve packaged UWP windows hosted in ApplicationFrameHost.exe via child CoreWindow PID, GetApplicationUserModelId, and IShellItemImageFactory into IconCache, and matches pinned taskbar PinItems to running windows using canonical match_exe and match_aumid without duplicates."
verify = "Unit tests validate pinned-to-running merge across Win32 exe paths and UWP AUMIDs without duplicate slots and RAII COM guard behavior; cargo test, pnpm test, and pnpm build pass."
covers = ["R2"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Taskbar Dock/Edge layout, multi-monitor secondary taskbar, contained hover & gapless animated previews"
description = "Aligns TaskbarView.tsx and tokens.css to DESIGN.md (52px bar inside 84px transparent host with zero black shadow rectangle, 42x40px stationary hover slot, inner 24x24px lift, cursor radial glow, unconstrained scrollWidth sizing, Dock/Edge-to-Edge toggle, active/running/multi-window pills), adds secondary-monitor taskbar window support (testbar taskbar rendered cleanly on DISPLAY2 or optional native secondary bar via config), and wires gapless non-activating animated PrintWindow hover previews in FlyoutView.tsx (fixing onMouseLeave to use close_preview_if_outside) with click-to-focus and per-window close."
verify = "Frontend and Rust tests verify multi-monitor bounds calculation, Dock/Edge layout class contracts, unconstrained width sync, and preview hover preemption; pnpm build, pnpm test, and cargo test pass."
covers = ["R3"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Full taskbar context menus: Jump Lists, New Window, Admin, raw-arg Location, End Task & empty bar"
description = "Implements app right-click context menu in FlyoutView.tsx and windows_tracker.rs (using RAII COM guard) with real recent/task Jump List items, New Window, Run as Admin (escaped target), Open File Location using raw_arg for explorer.exe /select, Pin/Unpin, Close Window(s), and End Task with error reporting, plus empty-bar right-click menu opening Task Manager, Dock/Edge toggle, TestBar Settings view, and Emergency restore."
verify = "Rust unit tests validate raw explorer.exe /select argument formatting, PowerShell/launch escaping, and Jump List parsing; pnpm build, pnpm test, and cargo test pass."
covers = ["R4"]
after = [3]
hitl = false
risk = "medium"

