# Stories for Epic 4: Start Menu 4 Adaptive Spaces, Universal Pinning, Edit Mode & Type-Anywhere Search
# Table order is build order.

[[entry]]
id = 1
type = "story"
title = "Spacious Start Menu (1140x680, no footer hints), enter/exit animations, dark scrollbars, 4 Spaces & zero-clipping grids"
description = "Upgrades Start Menu to a spacious 1140x680 logical canvas (respecting effective_scale), completely removes the bottom .start-footer tutorial hint bar (placing a subtle search icon button in the header while keeping type-anywhere search instant), adds global color-scheme:dark and custom slim dark scrollbars across the entire app, implements real CSS spring enter/exit open-close animations triggered on every start-state transition, wires show-time start-state hydration and unified IconCache, adds the spring sliding Space selector with hover ghost pill, cursor-tracking .spot-card radial spotlight, and prefers-reduced-motion support, removes hard .slice() truncation and clipped dividers across Personal/Work/Studio/Games/Custom lists so Clipboard/PC Health/Folders/Links all fit cleanly with zero clipping, and replaces residual Unicode glyphs with inline SVGs."
verify = "Vitest verifies unlimited pin rendering without clipping across all 4 Spaces + custom spaces, zero footer hint text, enter/exit animation state transitions, and sliding indicator state; pnpm build, pnpm test, and cargo test pass."
covers = ["R1"]
after = ["3.4"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Universal Edit Mode, floating + Space popover, redesigned Pinning + UWP All Apps, sleek Settings, Power & Shift layer"
description = "Replaces the colliding inline + custom-space input with a clean floating glass popover anchored below + (name + accent color + Enter/Esc), redesigns the Universal Pinning & All Apps overlay with instant filter search, clear pinned/unpinned states, dark slim scrollbars (zero horizontal overflow), and crisp + Folder / + File / + URL cards wrapped in WindowCoordinator modal-guard, extends apps_indexer.rs with UWP shell:AppsFolder discovery and RAII COM guard (removing the 180-app cap and fixing Discord Update.exe --processStart Discord.exe args), enables drag-and-drop reorder across all Space lists with pixel-centered inline SVG x unpin badges, rebuilds the TestBar Settings overlay into a polished Obsidian Layered Glass control panel (visual Dock/Edge layout cards, multi-monitor secondary taskbar mode, autostart toggle, shortcuts overview, emergency restore, zero C2 exclusions), verifies 2-click armed Power overlay, and wires Shift alternate actions to match every shown badge."
verify = "Rust unit tests verify UWP/Start indexer deduplication and RAII COM safety; Vitest verifies floating custom-space creation, Pinning filter/state, Shift action dispatch, redesigned Settings drawer actions, and 2-click Power arming; pnpm build, pnpm test, and cargo test pass."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Zero-loss type-anywhere RU<->EN search across apps, UWP, games, all Spaces & user files"
description = "Expands the Start Menu type-anywhere command palette search corpus to include user files (Desktop/Documents/Downloads index), UWP apps, games (consuming games-indexed updated later by 5.3), personalLinks, workApps, studioTools, gameLaunchers, and customSpaces alongside installed apps, guaranteeing zero dropped leading keystrokes on Start open, RU<->EN fuzzy ranking via layoutMap.ts, keyboard arrow selection, Enter launch, and Ctrl+Enter admin launch."
verify = "Vitest tests verify RU<->EN wrong-layout queries (including 'ntkt' -> Telegram), file/space/UWP search inclusion, ranking order, and Enter/Ctrl+Enter dispatch; pnpm build, pnpm test, and cargo test pass."
covers = ["R3"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Refactor sweep — Epic 4 Start Menu & search cleanup"
description = "Resolves deferred review items, removes any remaining UI tutorial hint copy or Unicode glyph hacks in StartView.tsx, and splits overly large StartView sections into clean subcomponents without changing behavior."
verify = "Automated audit confirms zero emoji/tutorial hints in StartView; pnpm build, pnpm test, and cargo test pass cleanly."
covers = ["R1", "R2", "R3"]
after = [3]
hitl = false
