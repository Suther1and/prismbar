# Initiative breakdown for TestBar — Windows 11 Taskbar & Start Menu Replacement
# Table order is build order.

[[epic]]
id = 1
slug = "epic-shell-foundation"
title = "Core Shell Host, Safe AppBar/Watchdog & 3-Window Lifecycle"
description = "TestBar compiles cleanly with automated Rust and Vitest suites, manages its 3 non-resizable transparent windows through one WindowCoordinator, safely hides/restores the native Windows 11 taskbar and HiDPI work area via AppBar + watchdog + single-instance guard, runs non-blocking global hooks (lone Win key + click-outside), classifies fullscreen strictly, and persists command-scoped config."
covers = ["R1", "R3", "R5", "R8"]

[[epic]]
id = 2
slug = "epic-taskbar-windows"
title = "Bottom Taskbar, Real Window Tracking, UWP Icons, Previews & Context Menus"
description = "The bottom taskbar renders pinned and running Windows apps with unified cached Win32/UWP icons, strictly contained hover effects, Dock/Edge-to-Edge switching, gapless non-activating live window previews, and complete native-grade right-click menus including Jump Lists and End Task."
covers = ["R2"]
after = [
  { epic = 1, needs = "completed shell foundation (WindowCoordinator, AppBar/watchdog, hooks, command-scoped PinItem config, and clean lib.rs baseline)" }
]

[[epic]]
id = 3
slug = "epic-tray-audio-calendar"
title = "Compact Tray Overflow, WASAPI Audio/Mixer, OSD, Layout & Calendar"
description = "The taskbar right cluster delivers a 6-column two-tier Tray Overflow (^) with real background window activation and native Win+B fallback, floating non-jitter Volume OSD, synced WASAPI master/active-session mixer and 3-role output switcher, live RU/EN layout toggle, and interactive Calendar with native Notification Center trigger."
covers = ["R4"]
after = [
  { epic = 2, needs = "completed taskbar foundation (IconCache batch delivery, raw-arg Location helper, Dock/Edge taskbar right-cluster anchors, and clean FlyoutView/lib.rs baseline)" }
]

[[epic]]
id = 4
slug = "epic-start-spaces-search"
title = "Start Menu 4 Adaptive Spaces, Universal Pinning, Edit Mode & Type-Anywhere Search"
description = "Start Menu opens reliably via Start button or lone Win key without breaking Win+<key> shortcuts, displays all 4 adaptive Spaces plus custom spaces with unlimited dynamic grids, drag-and-drop Edit Mode, modal-safe Universal Pinning for apps/folders/files/URLs, TestBar Settings drawer, Power overlay, working Shift layer, and zero-loss RU<->EN instant search across apps, UWP, games, spaces, and user files."
covers = ["R5", "R6"]
after = [
  { epic = 3, needs = "clean lib.rs, tokens.css, IconCache/UWP icons, lone Win hook, and modal-safe coordinator foundation from Epics 1-3" }
]

[[epic]]
id = 5
slug = "epic-hardware-media-games"
title = "Live Media, Clipboard, Telemetry, Peripherals, Steam Games & Standalone .exe Delivery"
description = "Start Menu right panels and Games space run live non-blocking WinRT SMTC media controls, persistent clipboard history, Bluetooth peripheral battery, human-readable CPU/RAM/RTX 4090 NVML telemetry with multi-PID process termination, dynamic Registry Steam library with 3D cover tilt and combos, culminating in a verified standalone Windows 11 testbar.exe."
covers = ["R7", "R8"]
after = [
  { epic = 1, needs = "completed Epic 1 shell foundation refactor sweep (1.5) for final release sign-off" },
  { epic = 2, needs = "completed Epic 2 taskbar refactor sweep (2.5) for final release sign-off" },
  { epic = 3, needs = "completed Epic 3 audio/tray/system_widgets refactor sweep (3.4)" },
  { epic = 4, needs = "completed Epic 4 Start Menu subcomponents, Settings, and search refactor sweep (4.4)" }
]
